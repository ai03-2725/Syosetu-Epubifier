name: Build and push container

on:
  push:
    tags:
      - '*'


jobs:
  build:
    name: Build and push containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - image-name: syosetu-epubifier-backend
            target: run-backend
            dockerfile: backend/Dockerfile.backend
          - image-name: syosetu-epubifier-rqworker
            target: run-rqworker
            dockerfile: backend/Dockerfile.backend
          - image-name: syosetu-epubifier-frontend
            dockerfile: frontend/Dockerfile.frontend
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image-name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: buildpush
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image-name }}
          subject-digest: ${{ steps.buildpush.outputs.digest }}
          push-to-registry: true